name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      # Keep CPU-sensitive parity measurements out of parallel SDK/process
      # integration load. Both invocations are required; no cases or timing
      # assertions are disabled or relaxed.
      - name: Unit and integration tests
        run: npm test -- --exclude=src/card-render.parity.test.ts
      - name: Isolated render parity and performance tests
        run: npx vitest run src/card-render.parity.test.ts --maxWorkers=1
      - name: Verify isolated profile policies against the locked host
        run: node --test scripts/verify-e2e-policy.mjs
      - name: build (must produce dist/index.js + dist/setup-entry.js)
        run: npm run build
      - name: verify dist/ exists
        run: |
          test -f dist/index.js || (echo "::error::dist/index.js missing after build" && exit 1)
          test -f dist/setup-entry.js || (echo "::error::dist/setup-entry.js missing after build" && exit 1)
          echo "✓ dist/ artifacts present"
      - name: npm pack --dry-run (verify tarball contents)
        run: node scripts/check-package.mjs

  runtime-store-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The main job tests the locked 2026.8.1 SDK. Exercise the declared
        # minimum and the verified instance-aware releases separately (#271).
        openclaw-version: [2026.6.9, 2026.9.9, 2026.10.2, 2026.10.5]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # 10.5's full host requires Node >=24.16; use its supported runtime
          # even though the small SDK store probe can also execute on Node 22.
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use the exact official host archive for the runtime contract
        # Only the SDK runtime contract is under test. Avoid npm's dependency
        # graph rewrite when replacing the locked host (edgesOut crash on 6.9).
        run: |
          npm pack openclaw@${{ matrix.openclaw-version }} --ignore-scripts --pack-destination "$RUNNER_TEMP"
          rm -rf node_modules/openclaw
          mkdir -p node_modules/openclaw
          tar -xzf "$RUNNER_TEMP/openclaw-${{ matrix.openclaw-version }}.tgz" --strip-components=1 -C node_modules/openclaw
      - name: Verify production runtime against the real host SDK
        run: node --test scripts/verify-runtime-store.mjs
      - name: Type-check the production runtime against this SDK
        run: npx tsc --ignoreConfig --noEmit --strict --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 src/runtime.ts
      - name: Verify isolated profile policies against the complete exact 10.5 host
        if: matrix.openclaw-version == '2026.10.5'
        # Full validators/policy gates need the host's own dependency graph;
        # the archive-only replacement above tests just the SDK store contract.
        run: |
          npm install --prefix "$RUNNER_TEMP/octo-policy-host" --ignore-scripts --omit=optional --no-audit --no-fund openclaw@2026.10.5
          OCTO_E2E_POLICY_HOST_ROOT="$RUNNER_TEMP/octo-policy-host/node_modules/openclaw" node --test scripts/verify-e2e-policy.mjs
